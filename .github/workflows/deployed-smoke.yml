name: Deployed app smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deployed-smoke.yml

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Hosting and authenticated app boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def request(url, method='GET'):
              for attempt in range(3):
                  try:
                      try:
                          response = opener.open(urllib.request.Request(url, method=method), timeout=30)
                      except urllib.error.HTTPError as error:
                          response = error
                      with response:
                          result = response.status, response.headers, response.read(262144)
                      if result[0] >= 500 or result[0] == 429:
                          if attempt < 2:
                              time.sleep(3)
                              continue
                      return result
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      time.sleep(3)

          code, headers, _ = request('https://ml-cherry-wherewego.web.app/', 'HEAD')
          assert code == 302, f'Hosting must return 302; got {code}'
          destination = headers.get('Location', '')
          parsed = urllib.parse.urlsplit(destination)
          assert (parsed.scheme == 'https' and parsed.hostname
                  and parsed.hostname.endswith('.run.app')
                  and parsed.username is None and parsed.password is None
                  and parsed.port in (None, 443)
                  and parsed.path in ('', '/') and not parsed.query and not parsed.fragment), 'Invalid Cloud Run destination'
          base = destination.rstrip('/')

          code, _, body = request(base + '/health')
          assert code == 200 and json.loads(body).get('ok') is True, 'Health check failed'
          code, _, body = request(base + '/login')
          page = body.decode('utf-8')
          assert code == 200 and '모아분류' in page and re.search(r'type=["\x27]password["\x27]', page), 'Login page failed'
          code, _, _ = request(base + '/api/items')
          assert code == 401, f'Items must require authentication; got {code}'
          code, headers, _ = request(base + '/browser/vnc.html')
          assert code == 303 and headers.get('Location') == '/login', 'noVNC must redirect unauthenticated clients to login'
          print('PASS: Hosting 302, HTTPS Cloud Run health/login, protected items and noVNC')
          print('Cloud Run:', base)
          PY
