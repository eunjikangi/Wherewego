name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          TEST_BROWSER: '1'
      - run: node --test tests/test_extension.cjs
      - run: for script in static/*.js extension/*.js; do node --check "$script"; done
      - run: for script in deploy/firebase/*.sh; do bash -n "$script"; done
